name: Test Suite

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  backend-tests:
    name: Backend Pytest & Migrations
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: aidb_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: rootpassword
          MYSQL_DATABASE: metriva_mysql_demo
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -u root -prootpassword"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run Django System Checks
        env:
          DATABASE_URL: postgresql://postgres:postgrespassword@localhost:5432/aidb_test
          SECRET_KEY: ci-test-secret-key-32chars-min-length-required
        run: |
          python backend/manage.py check

      - name: Run Database Migrations
        env:
          DATABASE_URL: postgresql://postgres:postgrespassword@localhost:5432/aidb_test
          SECRET_KEY: ci-test-secret-key-32chars-min-length-required
        run: |
          python backend/manage.py migrate

      - name: Run Seed Database Verification
        env:
          DATABASE_URL: postgresql://postgres:postgrespassword@localhost:5432/aidb_test
          SECRET_KEY: ci-test-secret-key-32chars-min-length-required
        run: |
          python backend/manage.py seed_database --scale demo --seed 42 --clear

      - name: Initialize MySQL Demo Database
        run: |
          python -c "
          import pymysql
          conn = pymysql.connect(host='127.0.0.1', port=3306, user='root', password='rootpassword', client_flag=pymysql.constants.CLIENT.MULTI_STATEMENTS)
          with open('database/mysql/init_metriva_mysql.sql') as f:
              sql = f.read()
          with conn.cursor() as cursor:
              cursor.execute(sql)
          conn.commit()
          conn.close()
          print('MySQL demo database initialized successfully.')
          "

      - name: Run Pytest Test Suite (161 Tests)
        env:
          DATABASE_URL: postgresql://postgres:postgrespassword@localhost:5432/aidb_test
          SECRET_KEY: ci-test-secret-key-32chars-min-length-required
          OPENAI_API_KEY: ""
          MYSQL_TEST_HOST: 127.0.0.1
          MYSQL_TEST_PORT: "3306"
          MYSQL_TEST_USER: metriva_readonly
          MYSQL_TEST_PASSWORD: readonly_secure_pass
          MYSQL_TEST_DB: metriva_mysql_demo
        run: |
          pytest backend/tests/ -v

      - name: Run Security Hardening Suite (16 Checks)
        env:
          DATABASE_URL: postgresql://postgres:postgrespassword@localhost:5432/aidb_test
          SECRET_KEY: ci-test-secret-key-32chars-min-length-required
        run: |
          pytest backend/tests/test_security_hardening.py -v

  frontend-tests-and-build:
    name: Frontend Vitest, TypeScript & Vite Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Run Vitest Unit & Integration Tests (38 Tests)
        working-directory: frontend
        run: npm test -- --run

      - name: Build Frontend Application (TypeScript & Vite)
        working-directory: frontend
        run: npm run build

