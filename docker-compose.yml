services:
  postgres:
    image: postgres:16-alpine
    container_name: aidb_postgres
    environment:
      POSTGRES_DB: aidb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d aidb"]
      interval: 5s
      timeout: 5s
      retries: 5

  # External MySQL 8.4 service for multi-engine integration & live testing
  # Run with: docker compose --profile mysql up
  mysql:
    image: mysql:8.4
    container_name: aidb_mysql
    profiles: ["mysql", "all"]
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-metriva_mysql_demo}
    ports:
      - "127.0.0.1:${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysqldata:/var/lib/mysql
      - ./database/mysql/init_metriva_mysql.sql:/docker-entrypoint-initdb.d/init_metriva_mysql.sql:ro
    healthcheck:
      # Daemon liveness probe: verifies MySQL engine is running and accepting TCP connections (not application-level user auth)
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p\"$$MYSQL_ROOT_PASSWORD\" || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: aidb_backend
    environment:
      DEBUG: "True"
      SECRET_KEY: "django-insecure-docker-dev-key-change-in-production"
      DATABASE_URL: "postgresql://postgres:postgrespassword@postgres:5432/aidb"
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      OPENAI_MODEL: "${OPENAI_MODEL:-gpt-4o-mini}"
      MAX_ROWS: "1000"
      MAX_QUERY_SECONDS: "10"
      MAX_SQL_LENGTH: "10000"
    ports:
      - "8000:8000"
    volumes:
      - ./backend/data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
    command: >
      sh -c "python manage.py migrate &&
             python manage.py seed_database --scale demo --seed 42 &&
             python manage.py runserver 0.0.0.0:8000"

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: aidb_frontend
    ports:
      - "5173:5173"
    environment:
      BACKEND_URL: "http://backend:8000"
      VITE_BACKEND_URL: "http://backend:8000"
    depends_on:
      - backend

volumes:
  pgdata:
  mysqldata:

