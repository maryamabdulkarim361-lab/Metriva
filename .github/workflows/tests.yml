name: Test Suite

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  backend-tests:
    name: Backend Pytest & Migrations
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: aidb_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run Django System Checks
        env:
          DATABASE_URL: postgresql://postgres:postgrespassword@localhost:5432/aidb_test
          SECRET_KEY: ci-test-secret-key-32chars-min-length-required
        run: |
          python backend/manage.py check

      - name: Run Database Migrations
        env:
          DATABASE_URL: postgresql://postgres:postgrespassword@localhost:5432/aidb_test
          SECRET_KEY: ci-test-secret-key-32chars-min-length-required
        run: |
          python backend/manage.py migrate

      - name: Run Seed Database Verification
        env:
          DATABASE_URL: postgresql://postgres:postgrespassword@localhost:5432/aidb_test
          SECRET_KEY: ci-test-secret-key-32chars-min-length-required
        run: |
          python backend/manage.py seed_database --scale demo --seed 42 --clear

      - name: Run Pytest Test Suite (149 Tests)
        env:
          DATABASE_URL: postgresql://postgres:postgrespassword@localhost:5432/aidb_test
          SECRET_KEY: ci-test-secret-key-32chars-min-length-required
          OPENAI_API_KEY: ""
        run: |
          pytest backend/tests/ -v

      - name: Run Security Hardening Suite (16 Checks)
        env:
          DATABASE_URL: postgresql://postgres:postgrespassword@localhost:5432/aidb_test
          SECRET_KEY: ci-test-secret-key-32chars-min-length-required
        run: |
          pytest backend/tests/test_security_hardening.py -v

  frontend-tests-and-build:
    name: Frontend Vitest, TypeScript & Vite Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Run Vitest Unit & Integration Tests (38 Tests)
        working-directory: frontend
        run: npm test -- --run

      - name: Build Frontend Application (TypeScript & Vite)
        working-directory: frontend
        run: npm run build

